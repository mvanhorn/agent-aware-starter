name: Validate AAA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run reference tests
        run: node --test reference/
      - name: Validate every JSON example
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node reference/validate.mjs "$file"
          done < <(find examples -type f -name '*.json' -print0)

